[project]
name = "aiden"
version = "0.1.0"
description = "A modular local autonomous agent runtime"
requires-python = ">=3.14"

dependencies = [
    "ollama",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "laya",
    "simpleeval",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]